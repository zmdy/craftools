<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CrafTools</title>
    
    <meta name="theme-color" content="#f97316">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-craftools.svg">

    <!-- Fonts Originais CrafTools -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- PWA Template CSS -->
    <link rel="stylesheet" href="./html/dist/style.css">

    <!-- CrafTools Original CSS -->
    <link rel="stylesheet" href="./craftools/craftools.css">

    <style>
        /* ==============================================================
           CSS INLINE DE ADAPTAÇÃO PWA vs CRAFTOOLS
           ============================================================== */
        
        /* Sobrescrita dos tokens de cor do PWA template para usar a paleta original do CrafTools */
        :root {
            --primary-50: #f4f4f5;   /* Fundo do app/canvas */
            --primary-100: #ffffff;  /* Fundo de cards/sidebar */
            --primary-200: #e4e4e7;  /* Hover/input */
            --primary-300: #d4d4d8;  /* Bordas */
            --primary-400: #a1a1aa;
            --primary-500: #ffffff;  /* Para cabeçalhos e menus offcanvas */
            --primary-600: #f97316;  /* Cor primária de destaque (Orange) */
            --primary-700: #ea580c;  /* Hover da cor principal */
            --primary-800: #c2410c;
            --primary-900: #9a3412;
            --primary-950: #18181b;  /* Texto principal */
            --accent: #f97316;
            --text: #71717a;
            --border: #e4e4e7;
        }

        [data-theme="dark"] {
            --primary-50: #09090b;   /* Fundo do app/canvas */
            --primary-100: #18181b;  /* Fundo de cards/sidebar */
            --primary-200: #27272a;  /* Hover/input */
            --primary-300: #3f3f46;  /* Bordas */
            --primary-400: #52525b;
            --primary-500: #18181b;  /* Para cabeçalhos e menus offcanvas */
            --primary-600: #f97316;  /* Cor primária de destaque (Orange) */
            --primary-700: #ea580c;  /* Hover da cor principal */
            --primary-800: #c2410c;
            --primary-900: #9a3412;
            --primary-950: #f4f4f5;  /* Texto principal */
            --accent: #f97316;
            --text: #a1a1aa;
            --border: #3f3f46;
            --warning-500: #f97316;  /* Inverte amarelos do warning para laranja */
            --warning-700: #ea580c;
        }

        /* Força as fontes do CrafTools no PWA */
        body, .header-area, .offcanvas, .footer-nav-area {
            font-family: 'DM Sans', sans-serif !important;
        }
        
        /* Tema laranja do CrafTools em substituição ao azul do PWA template */
        .text-primary, .text-info, .text-warning { color: var(--accent) !important; }
        .bg-primary, .bg-gradient, .bg-info, .bg-warning { background-color: var(--accent) !important; background-image: none !important; }
        .border-primary { border-color: var(--accent) !important; }
        .footer-nav ul li.active a, .footer-nav ul li.active button { color: var(--accent) !important; }

        /* Esconde a interface original gerada pelo Editor.js */
        .craftools-topbar, 
        .craftools-sidebar {
            display: none !important;
        }

        /* O canvas precisa ocupar todo o espaço do app-content */
        .page-content-wrapper {
            height: calc(100vh - 112px) !important;
            margin-top: 50px !important;
            overflow: hidden;
            position: relative;
        }
        
        #wrapper, .craftools-app {
            height: 100% !important;
            width: 100% !important;
        }

        /* Logo com hover */
        .logo-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .logo-wrapper img {
            height: 3vh;
            width: auto;
            transition: opacity 0.25s ease;
        }
        .logo-default { opacity: 1; }
        .logo-hover   { opacity: 0; position: absolute; top: 50%; left: 0; transform: translateY(-50%); }
        .logo-wrapper:hover .logo-default { opacity: 0; }
        .logo-wrapper:hover .logo-hover   { opacity: 1; }

        /* Painel direito: mesmo visual do sidenav-wrapper */
        .craftools-panel {
            width: 272px;
            background: var(--primary-500, #ffffff);
            border-left: 1px solid var(--border);
            z-index: 10;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Header do painel: igual ao sidenav-profile */
        .craftools-panel-head {
            background: var(--accent, #f97316) !important;
            background-image: linear-gradient(135deg, #f97316 0%, #ea580c 100%) !important;
            color: #ffffff !important;
            padding: 16px 14px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            border-bottom: none !important;
            position: sticky;
            top: 0;
            z-index: 1;
            flex-shrink: 0;
        }
        .craftools-panel-title {
            font-size: 15px !important;
            font-weight: 600 !important;
            color: #ffffff !important;
        }
        /* Botão fechar no painel: estilo consistente com branco */
        .craftools-panel #close-panel {
            color: rgba(255,255,255,0.85) !important;
            background: rgba(255,255,255,0.15) !important;
            border-radius: 6px !important;
        }
        .craftools-panel #close-panel:hover {
            background: rgba(255,255,255,0.3) !important;
            color: #ffffff !important;
        }
        /* Esconde o painel se estiver escondido via classe original */
        .craftools-panel.hidden {
            display: none !important;
        }
        /* Painel como Bottom Sheet apenas no Mobile */
        @media (max-width: 768px) {
            .craftools-panel {
                position: fixed !important;
                bottom: 62px !important;
                left: 0 !important;
                right: 0 !important;
                width: 100% !important;
                max-height: 50vh !important;
                z-index: 1000 !important;
                border-radius: 20px 20px 0 0 !important;
                border-left: none !important;
                border-top: 1px solid var(--border) !important;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.1) !important;
            }
            .craftools-panel-head {
                border-radius: 20px 20px 0 0 !important;
            }
        }

        /* Garante que o Header e Footer do PWA sobreponham o canvas */
        .header-area { z-index: 1050; }
        .footer-nav-area { z-index: 1050; }
        .offcanvas { z-index: 1060 !important; } /* Acima do header */

        .footer-nav-area i.material-symbols-outlined {
            font-size: 24px;
            margin-bottom: 2px;
        }
        
        /* Ajuste do botão de idioma no PWA */
        .pwa-lang-select {
            background: var(--bg-input, #f4f4f5);
            border: 1px solid var(--border, #e4e4e7);
            color: var(--text-primary, #18181b);
            padding: 4px 8px;
            border-radius: 6px;
            outline: none;
            font-size: 12px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
        }
        .pwa-lang-select option {
            background: var(--bg-shell, #ffffff);
            color: var(--text-primary, #18181b);
        }

        /* Estilo dos botões do footer (drag no PC) */
        .footer-nav-btn {
            background: none;
            border: none;
            color: #7773a6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s ease;
            cursor: grab;
            user-select: none;
        }
        .footer-nav-btn:hover,
        .footer-nav-btn:focus {
            color: var(--accent, #f97316) !important;
            outline: none;
        }
        .footer-nav-btn span {
            font-size: 11px;
            font-weight: 500;
        }
        .footer-nav-btn .material-symbols-outlined {
            font-size: 24px;
            margin-bottom: 2px;
        }

        /* Garantindo centralização perfeita e simetria no footer */
        .footer-nav ul li {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }
        .footer-nav li.center-menu-item {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }

        /* Botão Menu Central */
        .footer-nav li.center-menu-item a {
            background-color: rgba(249, 115, 22, 0.1);
            color: var(--primary-600, #f97316) !important;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -15px auto 0 auto !important;
            box-shadow: none;
            border: 2px solid var(--primary-100, #ffffff);
            transition: all 0.2s;
        }
        .footer-nav li.center-menu-item a:hover,
        .footer-nav li.center-menu-item a:focus {
            transform: scale(1.05);
            background-color: rgba(249, 115, 22, 0.2) !important;
        }
        [data-theme="dark"] .footer-nav li.center-menu-item a {
            border-color: #18181b;
        }

        /* Setup Mode */
        body.is-setup-mode .footer-nav ul li:not(.center-menu-item):not(.pwa-welcome-msg) {
            display: none !important;
        }
        body.is-setup-mode .footer-nav ul {
            justify-content: flex-start !important;
            width: 100% !important;
        }
        body.is-setup-mode .center-menu-item {
            margin: 0 !important;
            order: -1;
            padding-left: 10px;
            flex-shrink: 0;
        }
        body.is-setup-mode .center-menu-item a {
            margin: 0 !important;
            border: none;
        }
        body.is-setup-mode .pwa-welcome-msg {
            display: flex !important;
            align-items: center;
            justify-content: flex-start;
            flex: 1;
            padding-left: 15px;
            color: var(--accent);
            font-weight: 500;
        }
        .pwa-welcome-msg {
            display: none !important;
        }

        /* Sidenav Panel - Sliding Panel for Desktop, Bottom Sheet for Mobile */
        .sidenav-panel {
            width: 272px;
            margin-left: -272px; /* Closed by default */
            background: var(--primary-500, #ffffff);
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: margin-left 0.3s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .sidenav-panel.panel-open {
            margin-left: 0; /* Open on desktop */
        }
        @media (max-width: 768px) {
            .sidenav-panel {
                margin-left: 0; /* Clear desktop margin */
                position: fixed !important;
                left: 0;
                bottom: 62px;
                top: auto !important;
                width: 100%;
                height: 60vh;
                max-height: 60vh;
                border-right: none;
                border-top: 1px solid var(--border);
                border-radius: 20px 20px 0 0;
                transform: translateY(100%); /* Closed by default on mobile */
                box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            }
            .sidenav-panel.panel-open {
                transform: translateY(0); /* Open on mobile */
            }
            .sidenav-panel .sidenav-profile {
                border-radius: 20px 20px 0 0;
            }
        }

        /* Estilização Premium para botões de ação e select no Header */
        .header-content .box-icon {
            color: var(--text-primary, #18181b);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--bg-input, #f4f4f5);
            transition: background 0.2s, color 0.2s;
        }
        .header-content .box-icon:hover {
            background: var(--bg-hover, #e4e4e7);
            color: var(--accent, #f97316);
        }
        .header-content .box-icon span {
            font-size: 20px;
        }
        .header-content .box-icon.disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .header-content .box-icon.disabled:hover {
            background: var(--bg-input, #f4f4f5) !important;
            color: var(--text-primary, #18181b) !important;
        }

        /* Hover do sidenav igual ao footer (laranja, transição suave) */
        .sidenav-nav li a {
            color: #7773a6 !important;
            font-weight: 500 !important;
            transition: color 0.2s ease, background-color 0.2s ease;
        }
        .sidenav-nav li a:hover,
        .sidenav-nav li a:focus {
            color: var(--accent, #f97316) !important;
            background-color: transparent !important;
        }
        /* Dark mode */
        [data-theme="dark"] .header-area,
        [data-theme="dark"] .sidenav-wrapper,
        [data-theme="dark"] .offcanvas {
            background-color: #18181b !important;
            background-image: none !important;
        }
        [data-theme="dark"] .sidenav-nav li a {
            color: rgba(255, 255, 255, 0.6) !important;
        }
        [data-theme="dark"] .sidenav-nav li a:hover,
        [data-theme="dark"] .sidenav-nav li a:focus {
            color: var(--accent) !important;
            background-color: transparent !important;
        }
        [data-theme="dark"] .footer-nav-btn {
            color: rgba(255, 255, 255, 0.6);
        }
        [data-theme="dark"] .footer-nav-btn span {
            color: rgba(255, 255, 255, 0.6);
        }
        [data-theme="dark"] .footer-nav-btn:hover,
        [data-theme="dark"] .footer-nav-btn:focus {
            color: var(--accent) !important;
        }
        [data-theme="dark"] .footer-nav-btn:hover span,
        [data-theme="dark"] .footer-nav-btn:focus span {
            color: var(--accent) !important;
        }
    </style>

    <script type="module">
        import { Craftools } from './craftools/craftools.js';
        
        window.onload = () => {
            // Inicializa o sistema original
            new Craftools('#wrapper');

            // --- PROXY DE CLIQUES E EVENTOS (PWA -> CRAFTOOLS) ---
            setTimeout(() => {
                const toolsMap = {
                    'pwa-btn-titulo': { selector: '[data-tool="titulo"]', type: 'titulo' },
                    'pwa-btn-paragrafo': { selector: '[data-tool="paragrafo"]', type: 'paragrafo' },
                    'pwa-btn-imagem': { selector: '[data-tool="imagem"]', type: 'imagem' },
                    'pwa-btn-album': { selector: '[data-tool="album"]', type: 'album' },
                    'pwa-sidebar-titulo': { selector: '[data-tool="titulo"]', type: 'titulo' },
                    'pwa-sidebar-paragrafo': { selector: '[data-tool="paragrafo"]', type: 'paragrafo' },
                    'pwa-sidebar-imagem': { selector: '[data-tool="imagem"]', type: 'imagem' },
                    'pwa-sidebar-album': { selector: '[data-tool="album"]', type: 'album' },
                    'pwa-sidebar-papeis': { selector: '[data-tool="papeis"]', type: 'papeis' },
                    'pwa-sidebar-export': { selector: '#pdf-btn', type: null },
                    'pwa-sidebar-newpage': { selector: '#new-page-btn', type: null }
                };

                for (const [pwaId, info] of Object.entries(toolsMap)) {
                    const pwaBtn = document.getElementById(pwaId);
                    if (pwaBtn) {
                        // Proxy Click (Mobile / Generic)
                        pwaBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            const target = document.querySelector(info.selector);
                            if (target) {
                                target.click();
                            }
                        });
                        
                        // Proxy Drag (PC Desktop)
                        if (info.type) {
                            pwaBtn.addEventListener('dragstart', (e) => {
                                e.dataTransfer.setData('ToolType', info.type);
                                e.dataTransfer.setData('text/plain', info.type);
                                e.dataTransfer.effectAllowed = 'copy';
                            });
                        }
                    }
                }

                // Proxy do Undo/Redo
                const pwaUndo = document.getElementById('pwa-undo');
                const pwaRedo = document.getElementById('pwa-redo');

                pwaUndo?.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (pwaUndo.classList.contains('disabled')) return;
                    document.getElementById('undo-btn')?.click();
                });
                pwaRedo?.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (pwaRedo.classList.contains('disabled')) return;
                    document.getElementById('redo-btn')?.click();
                });

                const syncUndoRedoState = () => {
                    const originalUndo = document.getElementById('undo-btn');
                    const originalRedo = document.getElementById('redo-btn');
                    if (originalUndo && pwaUndo) {
                        pwaUndo.classList.toggle('disabled', originalUndo.disabled);
                    }
                    if (originalRedo && pwaRedo) {
                        pwaRedo.classList.toggle('disabled', originalRedo.disabled);
                    }
                };

                document.addEventListener('craftools-history-change', syncUndoRedoState);
                setInterval(syncUndoRedoState, 200);

                // Proxy do Zoom
                document.getElementById('pwa-zoom-in')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.getElementById('zoom-in-btn')?.click();
                });
                document.getElementById('pwa-zoom-out')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.getElementById('zoom-out-btn')?.click();
                });

                // Proxy Theme (Modo Escuro/Claro)
                document.getElementById('pwa-theme-btn')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.getElementById('theme-btn')?.click();
                });

                // Mutation Observer to keep theme UI in sync
                const updateThemeUI = () => {
                    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    const themeIcon = document.querySelector('#pwa-theme-btn .material-symbols-outlined');
                    if (themeIcon) {
                        themeIcon.textContent = isDark ? 'light_mode' : 'dark_mode';
                    }
                    const darkSwitch = document.getElementById('darkSwitch');
                    if (darkSwitch) {
                        darkSwitch.checked = isDark;
                    }
                };

                const themeObserver = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if (mutation.attributeName === 'data-theme') {
                            updateThemeUI();
                        }
                    });
                });
                themeObserver.observe(document.documentElement, { attributes: true });
                updateThemeUI();

                // Proxy Lang (Idioma)
                const pwaLangSelect = document.getElementById('pwa-lang-select');
                if (pwaLangSelect) {
                    const syncLang = () => {
                        const originalLang = document.getElementById('lang-select');
                        if (originalLang) {
                            pwaLangSelect.value = originalLang.value;
                        }
                    };
                    
                    syncLang();
                    
                    pwaLangSelect.addEventListener('change', (e) => {
                        const originalLang = document.getElementById('lang-select');
                        if (originalLang) {
                            originalLang.value = e.target.value;
                            originalLang.dispatchEvent(new Event('change'));
                        }
                    });

                    // Check for lang-select periodically since it gets re-created on render
                    setInterval(syncLang, 1000);
                }

                // Check setup mode periodically for bulletproof detection
                const checkSetupMode = () => {
                    const canvasExists = document.querySelector('#canvas-area');
                    if (canvasExists) {
                        document.body.classList.remove('is-setup-mode');
                        const welcomeMsg = document.querySelector('.pwa-welcome-msg');
                        if (welcomeMsg) {
                            welcomeMsg.remove(); // Remoção definitiva do DOM
                        }
                    } else {
                        document.body.classList.add('is-setup-mode');
                    }
                };
                setInterval(checkSetupMode, 500);
                checkSetupMode();

                // ── Remover offcanvas-backdrop para não bloquear drag ──────
                // O backdrop do Bootstrap impede arrastar ferramentas para o canvas
                const removeBackdrop = () => {
                    const backdrop = document.querySelector('.offcanvas-backdrop');
                    if (backdrop) backdrop.remove();
                };
                // Intercepta o evento de show do offcanvas
                // Intercepta o evento do menu toggle e anima ícone
                const menuIcon  = document.getElementById('pwa-menu-icon');
                const toggleMenuIcon = (isOpen) => {
                    if (!menuIcon) return;
                    menuIcon.style.transition = 'transform 0.25s ease, opacity 0.2s ease';
                    menuIcon.style.opacity = '0';
                    menuIcon.style.transform = isOpen ? 'rotate(90deg) scale(0.7)' : 'rotate(-90deg) scale(0.7)';
                    setTimeout(() => {
                        menuIcon.textContent = isOpen ? 'close' : 'menu';
                        menuIcon.style.opacity = '1';
                        menuIcon.style.transform = 'rotate(0deg) scale(1)';
                    }, 150);
                };

                document.getElementById('pwa-menu-toggle')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    const panel = document.getElementById('right-panel');
                    if (panel) {
                        const isNowOpen = panel.classList.toggle('panel-open');
                        toggleMenuIcon(isNowOpen);
                        
                        // Atualiza overlay se estiver no mobile
                        const overlay = document.getElementById('sidebar-overlay');
                        if (overlay && window.innerWidth <= 768) {
                            if (isNowOpen) overlay.classList.add('visible');
                            else overlay.classList.remove('visible');
                        }
                    }
                });
                // Observer para remover o backdrop assim que for adicionado ao DOM
                const backdropObserver = new MutationObserver(() => {
                    const backdrop = document.querySelector('.offcanvas-backdrop');
                    if (backdrop) {
                        backdrop.remove();
                    }
                });
                backdropObserver.observe(document.body, { childList: true, subtree: false });

                // ── i18n nos elementos do footer ─────────────────────────
                const applyPwaI18n = () => {
                    if (!window.craftoolsLang) return;
                    document.querySelectorAll('[data-i18n]').forEach(el => {
                        const key = el.getAttribute('data-i18n');
                        if (window.craftoolsApp && window.craftoolsApp.constructor) {
                            // Usa o mesmo sistema de tradução do craftools
                            import('./craftools/settings/Translations.js').then(({ I18n }) => {
                                const text = I18n.t(key);
                                if (text && text !== key) el.textContent = text;
                            });
                        }
                    });
                };
                // Aplica quando o idioma mudar
                const langSelect = document.getElementById('pwa-lang-select');
                if (langSelect) langSelect.addEventListener('change', applyPwaI18n);
                setInterval(applyPwaI18n, 1500);



                // ── Ctrl+Scroll = Zoom (sobrescreve o zoom nativo do browser) ──
                window.addEventListener('wheel', (e) => {
                    if (!e.ctrlKey) return;
                    e.preventDefault(); // bloqueia o zoom nativo do browser
                    if (e.deltaY < 0) {
                        // Scroll para cima = zoom in
                        document.getElementById('pwa-zoom-in')?.click();
                    } else {
                        // Scroll para baixo = zoom out
                        document.getElementById('pwa-zoom-out')?.click();
                    }
                }, { passive: false });

            }, 500); // tempo de segurança para renderização
        };
    </script>
</head>
<body class="is-setup-mode">
    <!-- HEADER PWA -->
    <div class="header-area" id="headerArea">
        <div class="container">
            <div class="header-content header-style-five position-relative d-flex align-items-center justify-content-between">
                
                <!-- Brand & Sidenav Toggler -->
                <div class="d-flex align-items-center gap-3">
                    <div class="logo-wrapper">
                        <img src="./assets/logo-craftools.svg" alt="CrafTools Logo" class="logo-default">
                        <img src="./assets/logo-craftools-hover.svg" alt="CrafTools Logo Hover" class="logo-hover">
                    </div>
