<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CrafTools PWA</title>
    
    <meta name="theme-color" content="#2869FE">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Fonts Originais CrafTools -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- PWA Template CSS -->
    <link rel="stylesheet" href="./html/dist/style.css">

    <!-- CrafTools Original CSS -->
    <link rel="stylesheet" href="./craftools/craftools.css">

    <style>
        /* ==============================================================
           CSS INLINE DE ADAPTAÇÃO PWA vs CRAFTOOLS
           ============================================================== */
        /* Força as fontes do CrafTools no PWA */
        body, .header-area, .offcanvas, .footer-nav-area {
            font-family: 'DM Sans', sans-serif !important;
        }

        /* Esconde a interface original gerada pelo Editor.js */
        .craftools-topbar, 
        .craftools-sidebar {
            display: none !important;
        }

        /* O canvas precisa ocupar todo o espaço do app-content */
        .page-content-wrapper {
            height: calc(100vh - 120px);
            margin-top: 60px;
            overflow: hidden;
            position: relative;
        }
        
        #wrapper, .craftools-app {
            height: 100% !important;
            width: 100% !important;
        }

        /* O painel direito (propriedades) pode virar um offcanvas ou modal
           Por enquanto, deixamos ele absoluto na direita ou solto no PWA */
        .craftools-panel {
            position: fixed;
            bottom: 60px;
            left: 0;
            width: 100%;
            max-height: 50vh;
            z-index: 1000;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }

        /* Esconde o painel se estiver escondido via classe original */
        .craftools-panel.hidden {
            display: none !important;
        }

        /* Garante que o Header e Footer do PWA sobreponham o canvas */
        .header-area { z-index: 1050; }
        .footer-nav-area { z-index: 1050; }

        /* Substituindo ícones de SVG do template pelos Material Symbols para simplificar */
        .footer-nav-area i.material-symbols-outlined {
            font-size: 24px;
            margin-bottom: 2px;
        }
    </style>

    <script type="module">
        import { Craftools } from './craftools/craftools.js';
        
        window.onload = () => {
            // Inicializa o sistema original
            new Craftools('#wrapper');

            // --- PROXY DE CLIQUES (PWA -> CRAFTOOLS) ---
            // Aguardamos um pouco para que o DOM do CrafTools seja gerado
            setTimeout(() => {
                // Mapeamento de ID do PWA para o data-tool do CrafTools
                const toolsMap = {
                    'pwa-btn-titulo': '[data-tool="titulo"]',
                    'pwa-btn-paragrafo': '[data-tool="paragrafo"]',
                    'pwa-btn-imagem': '[data-tool="imagem"]',
                    'pwa-btn-album': '[data-tool="album"]',
                    'pwa-btn-papeis': '[data-tool="papeis"]',
                    'pwa-btn-export': '#export-btn',
                    'pwa-btn-newpage': '#new-page-btn'
                };

                for (const [pwaId, selector] of Object.entries(toolsMap)) {
                    const pwaBtn = document.getElementById(pwaId);
                    if (pwaBtn) {
                        pwaBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            const target = document.querySelector(selector);
                            if (target) {
                                target.click();
                            }
                        });
                    }
                }

                // Proxy do Zoom
                document.getElementById('pwa-zoom-in')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.getElementById('zoom-in')?.click();
                });
                document.getElementById('pwa-zoom-out')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.getElementById('zoom-out')?.click();
                });

            }, 500); // tempo de segurança para renderização do Web Component
        };
    </script>
</head>
<body>
    <!-- HEADER PWA -->
    <div class="header-area" id="headerArea">
        <div class="container">
            <div class="header-content header-style-five position-relative d-flex align-items-center justify-content-between" style="height: 60px;">
                <!-- Menu / Sidebar Toggler -->
                <div class="navbar-toggler" id="affanNavbarToggler" data-bs-toggle="offcanvas" data-bs-target="#affanOffcanvas" aria-controls="affanOffcanvas" style="cursor:pointer;">
                    <span class="d-block"></span>
                    <span class="d-block"></span>
                    <span class="d-block"></span>
                </div>

                <!-- Logo / Titulo Central -->
                <div class="logo-wrapper" style="font-family: 'DM Serif Display', serif; font-size: 20px; color: #2869FE;">
                    CrafTools
                </div>

                <!-- Ações da direita (Zoom) -->
                <div class="right d-flex gap-2">
                    <a href="#" id="pwa-zoom-out" class="box-icon" style="text-decoration:none;">
                        <span class="material-symbols-outlined">zoom_out</span>
                    </a>
                    <a href="#" id="pwa-zoom-in" class="box-icon" style="text-decoration:none;">
                        <span class="material-symbols-outlined">zoom_in</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- OFFCANVAS LEFT (Menu Lateral PWA) -->
    <div class="offcanvas offcanvas-start" id="affanOffcanvas" data-bs-scroll="true" tabindex="-1" aria-labelledby="affanOffcanvsLabel">
        <div class="offcanvas-body p-0">
            <div class="sidenav-wrapper">
                <div class="sidenav-profile bg-gradient">
                    <div class="user-info mt-3">
                        <h6 class="user-name mb-0 text-white">Menu CrafTools</h6>
                    </div>
                </div>
                <ul class="sidenav-nav ps-0 mt-3">
                    <li><a href="#" id="pwa-btn-export"><span class="material-symbols-outlined">picture_as_pdf</span> Exportar PDF</a></li>
                    <li><a href="#" id="pwa-btn-papeis"><span class="material-symbols-outlined">layers</span> Papéis / Temas</a></li>
                    <li><a href="#" id="pwa-btn-album"><span class="material-symbols-outlined">photo_album</span> Álbum Completo</a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- CONTENT WRAPPER -->
    <div class="page-content-wrapper">
        <!-- Aqui o JS do CrafTools vai injetar a aplicação -->
        <main id="wrapper"></main>
    </div>

    <!-- FOOTER NAV PWA -->
    <div class="footer-nav-area" id="footerNav">
        <div class="container px-0">
            <div class="footer-nav position-relative">
                <ul class="h-100 d-flex align-items-center justify-content-between ps-0">
                    <li>
                        <a href="#" id="pwa-btn-titulo">
                            <span class="material-symbols-outlined">title</span>
                            <span>Título</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" id="pwa-btn-paragrafo">
                            <span class="material-symbols-outlined">notes</span>
                            <span>Texto</span>
                        </a>
                    </li>
                    
                    <!-- Botão Central Adicionar (Nova Página) -->
                    <li class="action-add">
                        <a href="#" id="pwa-btn-newpage">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 12H18" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M12 18V6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </a>
                    </li>

                    <li>
                        <a href="#" id="pwa-btn-imagem">
                            <span class="material-symbols-outlined">image</span>
                            <span>Imagem</span>
                        </a>
                    </li>
                    <li>
                        <a href="#affanOffcanvas" data-bs-toggle="offcanvas">
                            <span class="material-symbols-outlined">menu</span>
                            <span>Mais</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Scripts do PWA Template -->
    <script src="./html/dist/assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
